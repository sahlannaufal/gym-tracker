services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_MIXPANEL_TOKEN: ${NEXT_PUBLIC_MIXPANEL_TOKEN:-}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-}
    restart: unless-stopped
    environment:
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      MAYAR_API_KEY: ${MAYAR_API_KEY:-}
      MAYAR_API_BASE_URL: ${MAYAR_API_BASE_URL:-https://api.mayar.id/hl/v2}
      COACH_PRICE_IDR: ${COACH_PRICE_IDR:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
    # Next.js standalone server, jangan expose ke publik — akses via Caddy
    expose:
      - "3000"
    networks:
      - caddy_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /root/gitar:/gitar:ro
    networks:
      - caddy_net

volumes:
  caddy_data:
  caddy_config:

networks:
  caddy_net:
    name: caddy_net
